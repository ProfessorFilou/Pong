<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PONG</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Bebas+Neue&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050508;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'DM Mono', monospace;
  }

  #wrap {
    position: relative;
    width: 900px;
    height: 580px;
  }

  #wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  canvas { position: relative; z-index: 1; display: block; }

  #scores {
    position: absolute; top: 28px; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center;
    gap: 64px; z-index: 2; pointer-events: none;
  }

  .score-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px; line-height: 1; letter-spacing: 2px;
    transition: transform 0.1s ease, filter 0.1s ease;
  }
  .score-val.flash { transform: scale(1.18); filter: brightness(2.5); }

  #score-l { color: #00f5ff; text-shadow: 0 0 20px #00f5ff, 0 0 60px rgba(0,245,255,0.4); }
  #score-r { color: #ff3cac; text-shadow: 0 0 20px #ff3cac, 0 0 60px rgba(255,60,172,0.4); }

  .score-divider {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 40px; color: rgba(255,255,255,0.12); margin-top: 10px;
  }

  #speed-label {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
    color: rgba(255,255,255,0.18); z-index: 2;
  }

  /* ── Speech bubbles ── */
  .bubble {
    position: absolute;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: bubblePop 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  .bubble.fade-out {
    animation: bubbleFade 0.4s ease forwards;
  }

  .bubble-inner {
    background: rgba(255,255,255,0.96);
    border-radius: 18px;
    padding: 8px 14px;
    font-size: 28px;
    line-height: 1;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    position: relative;
  }

  /* Triangle tail pointing down */
  .bubble-inner::after {
    content: '';
    position: absolute;
    bottom: -10px; left: 50%;
    transform: translateX(-50%);
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 11px solid rgba(255,255,255,0.96);
  }

  /* Left paddle bubble: tail points right */
  .bubble.left .bubble-inner::after {
    bottom: auto; left: auto;
    top: 50%; right: -10px;
    transform: translateY(-50%);
    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
    border-left: 11px solid rgba(255,255,255,0.96);
    border-right: none;
  }

  /* Right paddle bubble: tail points left */
  .bubble.right .bubble-inner::after {
    bottom: auto; right: auto;
    top: 50%; left: -10px;
    transform: translateY(-50%);
    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
    border-right: 11px solid rgba(255,255,255,0.96);
    border-left: none;
  }

  @keyframes bubblePop {
    0%   { opacity: 0; transform: scale(0.4); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes bubbleFade {
    0%   { opacity: 1; transform: scale(1) translateY(0); }
    100% { opacity: 0; transform: scale(0.85) translateY(-12px); }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="scores">
    <span class="score-val" id="score-l">0</span>
    <span class="score-divider">—</span>
    <span class="score-val" id="score-r">0</span>
  </div>
  <canvas id="c" width="900" height="580"></canvas>
  <div id="speed-label">RALLY · <span id="speed-num">0</span></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const wrap = document.getElementById('wrap');

const COL_L = '#00f5ff';
const COL_R = '#ff3cac';

const PAD_W = 10, PAD_H = 88, PAD_MARGIN = 38;
const BALL_R = 8;
const BASE_SPEED = 7;
const MAX_SPEED = 20;
const MAX_ANGLE = Math.PI * 0.38;

let scores = { l: 0, r: 0 };
let rally = 0;
let scoring = false;

let ball = { x: W/2, y: H/2, vx: 0, vy: 0 };
let padL = { y: H/2, vy: 0 };
let padR = { y: H/2, vy: 0 };
let offsetL = 0, offsetR = 0;

const TRAIL_LEN = 30;
let trail = [];
let particles = [];

// ── Speech bubbles ──
const happyEmojis = ['😄','🎉','😎','🥳','😁','✨','🔥','💪'];
const sadEmojis   = ['😢','😭','😩','💀','😬','🥲','😔','😫'];

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

let activeBubbles = [];

function showBubble(side, isWinner) {
  // Remove any existing bubble for this side
  activeBubbles = activeBubbles.filter(b => {
    if (b.side === side) { b.el.remove(); return false; }
    return true;
  });

  const el = document.createElement('div');
  el.className = `bubble ${side}`;

  const inner = document.createElement('div');
  inner.className = 'bubble-inner';
  inner.textContent = isWinner ? rand(happyEmojis) : rand(sadEmojis);
  el.appendChild(inner);

  // Position: next to the paddle
  const lx = PAD_MARGIN + PAD_W/2;
  const rx = W - PAD_MARGIN - PAD_W/2;
  const padY = side === 'left' ? padL.y : padR.y;

  if (side === 'left') {
    el.style.left = (lx + PAD_W/2 + 14) + 'px';
  } else {
    el.style.right = (W - (rx - PAD_W/2 - 14) - 60) + 'px';
  }
  el.style.top = Math.max(10, Math.min(H - 70, padY - 28)) + 'px';

  wrap.appendChild(el);

  const entry = { side, el };
  activeBubbles.push(entry);

  // Fade out after 1.8s
  setTimeout(() => {
    el.classList.add('fade-out');
    setTimeout(() => {
      el.remove();
      activeBubbles = activeBubbles.filter(b => b !== entry);
    }, 400);
  }, 1800);
}

// ── Reset ──
function resetBall(dir) {
  scoring = false;
  ball.x = W / 2;
  ball.y = 120 + Math.random() * (H - 240);
  const angle = (Math.random() > 0.5 ? 1 : -1) * (0.35 + Math.random() * MAX_ANGLE * 0.7);
  const spd = BASE_SPEED;
  ball.vx = dir * spd * Math.cos(angle);
  ball.vy = spd * Math.sin(angle);
  trail = [];
  rally = 0;
  // Fair random offsets — both sides get equal chance to miss
  // Key fix: make offsets large enough that neither side always wins
  offsetL = (Math.random() - 0.5) * PAD_H * 0.9;
  offsetR = (Math.random() - 0.5) * PAD_H * 0.9;
  document.getElementById('speed-num').textContent = '0';
}

// ── AI ──
function moveAI(pad, ballY, offset, dt) {
  const target = Math.max(PAD_H/2, Math.min(H - PAD_H/2, ballY + offset));
  const diff = target - pad.y;
  // Speed deliberately slow and equal for both sides
  const speed = 4.8 + rally * 0.12;
  pad.vy = diff * 0.11 * speed;
  pad.vy = Math.max(-speed, Math.min(speed, pad.vy));
  pad.y += pad.vy * dt * 60;
  pad.y = Math.max(PAD_H/2, Math.min(H - PAD_H/2, pad.y));
}

// ── Particles ──
function spawnParticles(x, y, color) {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 5;
    particles.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      life: 1, decay: 0.025 + Math.random()*0.035, size: 1.5 + Math.random()*2.5, color });
  }
}

function updateParticles(dt) {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
    p.vx *= 0.93; p.vy *= 0.93; p.life -= p.decay;
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.save(); ctx.globalAlpha = p.life * p.life;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 8;
    ctx.fill(); ctx.restore();
  }
}

function drawPaddle(x, y, color) {
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = 32;
  ctx.fillStyle = color;
  rrect(x - PAD_W/2, y - PAD_H/2, PAD_W, PAD_H, 5); ctx.fill();
  ctx.shadowBlur = 8; ctx.fillStyle = '#fff';
  rrect(x - PAD_W/2 + 2, y - PAD_H/2 + 2, PAD_W-4, PAD_H-4, 3); ctx.fill();
  ctx.restore();
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function drawBall() {
  for (let i = 0; i < trail.length; i++) {
    const t = i / trail.length;
    const col = ball.vx > 0 ? COL_L : COL_R;
    ctx.save(); ctx.globalAlpha = t * t * 0.5;
    ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, BALL_R*(0.3+t*0.7), 0, Math.PI*2);
    ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 10; ctx.fill(); ctx.restore();
  }
  const col = ball.vx > 0 ? COL_R : COL_L;
  ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 40;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R*1.9, 0, Math.PI*2);
  ctx.fillStyle = col+'33'; ctx.fill(); ctx.restore();
  ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
}

function flashScore(side) {
  const el = document.getElementById('score-' + side);
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 180);
}

// ── Main loop ──
let lastTs = null;

function tick(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;

  const lx = PAD_MARGIN + PAD_W/2;
  const rx = W - PAD_MARGIN - PAD_W/2;

  if (ball.vx < 0) moveAI(padL, ball.y, offsetL, dt);
  else padL.y += (H/2 - padL.y) * 0.03;

  if (ball.vx > 0) moveAI(padR, ball.y, offsetR, dt);
  else padR.y += (H/2 - padR.y) * 0.03;

  padL.y = Math.max(PAD_H/2, Math.min(H-PAD_H/2, padL.y));
  padR.y = Math.max(PAD_H/2, Math.min(H-PAD_H/2, padR.y));

  if (!scoring) {
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > TRAIL_LEN) trail.shift();

    ball.x += ball.vx * dt * 60;
    ball.y += ball.vy * dt * 60;

    if (ball.y - BALL_R < 0) {
      ball.y = BALL_R; ball.vy = Math.abs(ball.vy);
      spawnParticles(ball.x, 0, '#ffffff55');
    }
    if (ball.y + BALL_R > H) {
      ball.y = H - BALL_R; ball.vy = -Math.abs(ball.vy);
      spawnParticles(ball.x, H, '#ffffff55');
    }

    // Left paddle hit
    if (ball.vx < 0 &&
        ball.x - BALL_R <= lx + PAD_W/2 &&
        ball.x + BALL_R >= lx - PAD_W/2 &&
        ball.y >= padL.y - PAD_H/2 - BALL_R &&
        ball.y <= padL.y + PAD_H/2 + BALL_R) {

      ball.x = lx + PAD_W/2 + BALL_R + 1;
      const hitPos = Math.max(-1, Math.min(1, (ball.y - padL.y) / (PAD_H/2)));
      const angle = hitPos * MAX_ANGLE;
      rally++;
      const spd = Math.min(BASE_SPEED + rally * 0.25, MAX_SPEED);
      ball.vx = Math.abs(spd * Math.cos(angle));
      ball.vy = spd * Math.sin(angle);
      spawnParticles(ball.x, ball.y, COL_L);
      offsetR = (Math.random() - 0.5) * PAD_H * 0.9;
      document.getElementById('speed-num').textContent = rally;
    }

    // Right paddle hit
    if (ball.vx > 0 &&
        ball.x + BALL_R >= rx - PAD_W/2 &&
        ball.x - BALL_R <= rx + PAD_W/2 &&
        ball.y >= padR.y - PAD_H/2 - BALL_R &&
        ball.y <= padR.y + PAD_H/2 + BALL_R) {

      ball.x = rx - PAD_W/2 - BALL_R - 1;
      const hitPos = Math.max(-1, Math.min(1, (ball.y - padR.y) / (PAD_H/2)));
      const angle = hitPos * MAX_ANGLE;
      rally++;
      const spd = Math.min(BASE_SPEED + rally * 0.25, MAX_SPEED);
      ball.vx = -Math.abs(spd * Math.cos(angle));
      ball.vy = spd * Math.sin(angle);
      spawnParticles(ball.x, ball.y, COL_R);
      offsetL = (Math.random() - 0.5) * PAD_H * 0.9;
      document.getElementById('speed-num').textContent = rally;
    }

    // Score — ball exits LEFT → right paddle scores, left loses
    if (ball.x < -BALL_R * 2) {
      scoring = true;
      scores.r++;
      document.getElementById('score-r').textContent = scores.r;
      flashScore('r');
      spawnParticles(0, ball.y, COL_R);
      // Left missed → sad; right scored → happy
      showBubble('left',  false); // loser
      showBubble('right', true);  // winner
      setTimeout(() => resetBall(1), 1100);
    }

    // Score — ball exits RIGHT → left paddle scores, right loses
    if (ball.x > W + BALL_R * 2) {
      scoring = true;
      scores.l++;
      document.getElementById('score-l').textContent = scores.l;
      flashScore('l');
      spawnParticles(W, ball.y, COL_L);
      // Right missed → sad; left scored → happy
      showBubble('right', false); // loser
      showBubble('left',  true);  // winner
      setTimeout(() => resetBall(-1), 1100);
    }
  }

  updateParticles(dt);

  ctx.clearRect(0, 0, W, H);
  const vig = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.85);
  vig.addColorStop(0, 'rgba(5,5,8,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);

  ctx.save(); ctx.setLineDash([10,18]);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.restore();

  drawParticles();
  drawBall();
  drawPaddle(lx, padL.y, COL_L);
  drawPaddle(rx, padR.y, COL_R);

  requestAnimationFrame(tick);
}

resetBall(Math.random() > 0.5 ? 1 : -1);
requestAnimationFrame(tick);
</script>
</body>
</html>
