<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>PONG — Ultimate</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #030306;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
    color: #e0e0e0;
    padding: 20px;
    gap: 18px;
  }

  /* ── Header ── */
  header {
    text-align: center;
    user-select: none;
  }
  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    letter-spacing: 8px;
    background: linear-gradient(90deg, #00f5ff, #ff3cac);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(0,245,255,0.3);
  }
  header p {
    font-size: 12px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.35);
    margin-top: 2px;
  }

  /* ── Main layout ── */
  .main {
    display: flex;
    gap: 28px;
    align-items: flex-start;
  }

  /* ── Game area ── */
  #wrap {
    position: relative;
    width: 900px;
    height: 580px;
    background: #050508;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06),
                0 20px 60px rgba(0,0,0,0.6),
                0 0 80px rgba(0,245,255,0.05);
  }
  #wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  canvas {
    position: relative;
    z-index: 1;
    display: block;
  }

  #scores {
    position: absolute;
    top: 24px; left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 56px;
    z-index: 2;
    pointer-events: none;
  }
  .score-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 68px;
    line-height: 1;
    letter-spacing: 2px;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .score-val.flash {
    transform: scale(1.2);
    filter: brightness(2.8);
  }
  #score-l {
    color: #00f5ff;
    text-shadow: 0 0 18px #00f5ff, 0 0 50px rgba(0,245,255,0.35);
  }
  #score-r {
    color: #ff3cac;
    text-shadow: 0 0 18px #ff3cac, 0 0 50px rgba(255,60,172,0.35);
  }
  .score-divider {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: rgba(255,255,255,0.1);
    margin-top: 8px;
  }

  #speed-label {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    z-index: 2;
  }

  /* ── Side panel ── */
  .panel {
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .panel-section {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 14px;
  }
  .panel-section h3 {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 10px;
  }

  button {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    color: #ddd;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.5px;
    padding: 10px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s ease;
    margin-bottom: 6px;
  }
  button:last-child { margin-bottom: 0; }
  button:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.25);
    color: #fff;
  }
  button.active {
    background: rgba(0,245,255,0.15);
    border-color: #00f5ff;
    color: #00f5ff;
    box-shadow: 0 0 16px rgba(0,245,255,0.2);
  }
  button.danger {
    border-color: rgba(255,60,172,0.3);
  }
  button.danger:hover {
    background: rgba(255,60,172,0.12);
    border-color: #ff3cac;
    color: #ff3cac;
  }

  .diff-btn.active.leicht  { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,0.12); box-shadow: 0 0 14px rgba(74,222,128,0.15); }
  .diff-btn.active.mittel  { border-color: #fbbf24; color: #fbbf24; background: rgba(251,191,36,0.12); box-shadow: 0 0 14px rgba(251,191,36,0.15); }
  .diff-btn.active.schwer  { border-color: #f87171; color: #f87171; background: rgba(248,113,113,0.12); box-shadow: 0 0 14px rgba(248,113,113,0.15); }
  .diff-btn.active.unmoeglich { border-color: #c084fc; color: #c084fc; background: rgba(192,132,252,0.12); box-shadow: 0 0 14px rgba(192,132,252,0.15); }

  .info-line {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    line-height: 1.5;
  }
  .info-line strong {
    color: #00f5ff;
    font-weight: 500;
  }

  /* ── Footer hint ── */
  footer {
    font-size: 11px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.25);
    text-align: center;
  }

  /* ── Speech bubbles ── */
  .bubble {
    position: absolute;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: bubblePop 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  .bubble.fade-out {
    animation: bubbleFade 0.4s ease forwards;
  }
  .bubble-inner {
    background: rgba(255,255,255,0.96);
    border-radius: 16px;
    padding: 7px 13px;
    font-size: 26px;
    line-height: 1;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    position: relative;
  }
  .bubble-inner::after {
    content: '';
    position: absolute;
    bottom: -9px; left: 50%;
    transform: translateX(-50%);
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 10px solid rgba(255,255,255,0.96);
  }
  .bubble.left .bubble-inner::after {
    bottom: auto; left: auto;
    top: 50%; right: -9px;
    transform: translateY(-50%);
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 10px solid rgba(255,255,255,0.96);
    border-right: none;
  }
  .bubble.right .bubble-inner::after {
    bottom: auto; right: auto;
    top: 50%; left: -9px;
    transform: translateY(-50%);
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-right: 10px solid rgba(255,255,255,0.96);
    border-left: none;
  }
  @keyframes bubblePop {
    0%   { opacity: 0; transform: scale(0.4); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes bubbleFade {
    0%   { opacity: 1; transform: scale(1) translateY(0); }
    100% { opacity: 0; transform: scale(0.85) translateY(-12px); }
  }
</style>
</head>
<body>

<header>
  <h1>PONG</h1>
  <p>ULTIMATE EDITION</p>
</header>

<div class="main">
  <!-- Game -->
  <div id="wrap">
    <div id="scores">
      <span class="score-val" id="score-l">0</span>
      <span class="score-divider">—</span>
      <span class="score-val" id="score-r">0</span>
    </div>
    <canvas id="c" width="900" height="580"></canvas>
    <div id="speed-label">RALLY · <span id="speed-num">0</span></div>
  </div>

  <!-- Side Panel -->
  <div class="panel">
    <div class="panel-section">
      <h3>Modus</h3>
      <button id="btn-human" class="active">Mensch vs AI</button>
      <button id="btn-ai">AI vs AI</button>
    </div>

    <div class="panel-section">
      <h3>Schwierigkeit</h3>
      <button class="diff-btn leicht active" data-diff="leicht">Leicht</button>
      <button class="diff-btn mittel" data-diff="mittel">Mittel</button>
      <button class="diff-btn schwer" data-diff="schwer">Schwer</button>
      <button class="diff-btn unmoeglich" data-diff="unmoeglich">Unmöglich</button>
    </div>

    <div class="panel-section">
      <h3>Steuerung</h3>
      <button id="btn-start">▶ Start / Pause</button>
      <button id="btn-restart" class="danger">↺ Neustart</button>
    </div>

    <div class="panel-section">
      <h3>Info</h3>
      <div class="info-line">
        Modus: <strong id="info-mode">Mensch vs AI</strong><br>
        Level: <strong id="info-diff">Leicht</strong><br>
        Status: <strong id="info-status">Bereit</strong>
      </div>
    </div>

    <div class="panel-section">
      <h3>Tasten</h3>
      <div class="info-line" style="font-size:11px; line-height:1.7">
        <strong>W</strong> / <strong>↑</strong> → hoch<br>
        <strong>S</strong> / <strong>↓</strong> → runter<br>
        <strong>Leertaste</strong> → Pause
      </div>
    </div>
  </div>
</div>

<footer>
  Ballgeschwindigkeit steigt mit dem Rally · Viel Spaß beim Zocken
</footer>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const wrap = document.getElementById('wrap');

const COL_L = '#00f5ff';
const COL_R = '#ff3cac';
const PAD_W = 12;
const PAD_MARGIN = 38;
const BALL_R = 9;

// ── Difficulty presets ──
const DIFFS = {
  leicht: {
    label: 'Leicht',
    padH: 110,
    baseSpeed: 6.2,
    maxSpeed: 16,
    aiSpeed: 4.2,
    aiReact: 0.075,
    maxAngle: Math.PI * 0.36,
    offsetRange: 0.95
  },
  mittel: {
    label: 'Mittel',
    padH: 96,
    baseSpeed: 7.4,
    maxSpeed: 19,
    aiSpeed: 5.4,
    aiReact: 0.095,
    maxAngle: Math.PI * 0.40,
    offsetRange: 0.80
  },
  schwer: {
    label: 'Schwer',
    padH: 84,
    baseSpeed: 8.6,
    maxSpeed: 22,
    aiSpeed: 6.8,
    aiReact: 0.115,
    maxAngle: Math.PI * 0.42,
    offsetRange: 0.65
  },
  unmoeglich: {
    label: 'Unmöglich',
    padH: 72,
    baseSpeed: 10.0,
    maxSpeed: 26,
    aiSpeed: 9.2,
    aiReact: 0.145,
    maxAngle: Math.PI * 0.44,
    offsetRange: 0.45
  }
};

let currentDiff = 'leicht';
let cfg = DIFFS[currentDiff];

let scores = { l: 0, r: 0 };
let rally = 0;
let scoring = false;
let humanMode = true;
let running = false;          // start paused

let ball = { x: W/2, y: H/2, vx: 0, vy: 0 };
let padL = { y: H/2, vy: 0 };
let padR = { y: H/2, vy: 0 };
let offsetL = 0, offsetR = 0;

const TRAIL_LEN = 34;
let trail = [];
let particles = [];

// ── Keyboard ──
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','KeyW','KeyS','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space') togglePause();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ── UI ──
const btnHuman   = document.getElementById('btn-human');
const btnAI      = document.getElementById('btn-ai');
const btnStart   = document.getElementById('btn-start');
const btnRestart = document.getElementById('btn-restart');
const infoMode   = document.getElementById('info-mode');
const infoDiff   = document.getElementById('info-diff');
const infoStatus = document.getElementById('info-status');

btnHuman.addEventListener('click', () => {
  humanMode = true;
  btnHuman.classList.add('active');
  btnAI.classList.remove('active');
  infoMode.textContent = 'Mensch vs AI';
  resetBall(Math.random() > 0.5 ? 1 : -1);
});

btnAI.addEventListener('click', () => {
  humanMode = false;
  btnAI.classList.add('active');
  btnHuman.classList.remove('active');
  infoMode.textContent = 'AI vs AI';
  resetBall(Math.random() > 0.5 ? 1 : -1);
});

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentDiff = btn.dataset.diff;
    cfg = DIFFS[currentDiff];
    infoDiff.textContent = cfg.label;
    // apply new paddle height immediately
    padL.y = Math.max(cfg.padH/2, Math.min(H - cfg.padH/2, padL.y));
    padR.y = Math.max(cfg.padH/2, Math.min(H - cfg.padH/2, padR.y));
    resetBall(Math.random() > 0.5 ? 1 : -1);
  });
});

function togglePause() {
  running = !running;
  infoStatus.textContent = running ? 'Läuft' : 'Pause';
  btnStart.textContent = running ? '⏸ Pause' : '▶ Start / Pause';
}
btnStart.addEventListener('click', togglePause);

btnRestart.addEventListener('click', () => {
  scores = { l: 0, r: 0 };
  document.getElementById('score-l').textContent = '0';
  document.getElementById('score-r').textContent = '0';
  running = false;
  infoStatus.textContent = 'Bereit';
  btnStart.textContent = '▶ Start / Pause';
  resetBall(Math.random() > 0.5 ? 1 : -1);
});

// ── Speech bubbles ──
const happyEmojis = ['😄','🎉','😎','🥳','😁','✨','🔥','💪','🏆'];
const sadEmojis   = ['😢','😭','😩','💀','😬','🥲','😔','😫','🤡'];
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
let activeBubbles = [];

function showBubble(side, isWinner) {
  activeBubbles = activeBubbles.filter(b => {
    if (b.side === side) { b.el.remove(); return false; }
    return true;
  });
  const el = document.createElement('div');
  el.className = `bubble ${side}`;
  const inner = document.createElement('div');
  inner.className = 'bubble-inner';
  inner.textContent = isWinner ? rand(happyEmojis) : rand(sadEmojis);
  el.appendChild(inner);

  const lx = PAD_MARGIN + PAD_W/2;
  const rx = W - PAD_MARGIN - PAD_W/2;
  const padY = side === 'left' ? padL.y : padR.y;

  if (side === 'left') {
    el.style.left = (lx + PAD_W/2 + 16) + 'px';
  } else {
    el.style.right = (W - (rx - PAD_W/2 - 16) - 58) + 'px';
  }
  el.style.top = Math.max(12, Math.min(H - 68, padY - 26)) + 'px';
  wrap.appendChild(el);
  const entry = { side, el };
  activeBubbles.push(entry);

  setTimeout(() => {
    el.classList.add('fade-out');
    setTimeout(() => {
      el.remove();
      activeBubbles = activeBubbles.filter(b => b !== entry);
    }, 400);
  }, 1700);
}

// ── Reset ──
function resetBall(dir) {
  scoring = false;
  ball.x = W / 2;
  ball.y = 110 + Math.random() * (H - 220);
  const angle = (Math.random() > 0.5 ? 1 : -1) * (0.25 + Math.random() * cfg.maxAngle * 0.7);
  const spd = cfg.baseSpeed;
  ball.vx = dir * spd * Math.cos(angle);
  ball.vy = spd * Math.sin(angle);
  trail = [];
  rally = 0;
  offsetL = (Math.random() - 0.5) * cfg.padH * cfg.offsetRange;
  offsetR = (Math.random() - 0.5) * cfg.padH * cfg.offsetRange;
  document.getElementById('speed-num').textContent = '0';
}

// ── AI ──
function moveAI(pad, ballY, offset, dt) {
  const target = Math.max(cfg.padH/2, Math.min(H - cfg.padH/2, ballY + offset));
  const diff = target - pad.y;
  const speed = cfg.aiSpeed + rally * 0.11;
  pad.vy = diff * cfg.aiReact * speed;
  pad.vy = Math.max(-speed, Math.min(speed, pad.vy));
  pad.y += pad.vy * dt * 60;
  pad.y = Math.max(cfg.padH/2, Math.min(H - cfg.padH/2, pad.y));
}

// ── Human ──
function moveHuman(pad, dt) {
  const speed = 10.5;
  let dir = 0;
  if (keys['KeyW'] || keys['ArrowUp'])   dir = -1;
  if (keys['KeyS'] || keys['ArrowDown']) dir =  1;
  pad.y += dir * speed * dt * 60;
  pad.y = Math.max(cfg.padH/2, Math.min(H - cfg.padH/2, pad.y));
}

// ── Particles ──
function spawnParticles(x, y, color) {
  for (let i = 0; i < 22; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 2.4 + Math.random() * 5.8;
    particles.push({
      x, y,
      vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      life: 1, decay: 0.02 + Math.random()*0.03,
      size: 1.5 + Math.random()*2.8, color
    });
  }
}
function updateParticles(dt) {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.vx *= 0.93; p.vy *= 0.93;
    p.life -= p.decay;
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life * p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.restore();
  }
}

function drawPaddle(x, y, color) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 36;
  ctx.fillStyle = color;
  rrect(x - PAD_W/2, y - cfg.padH/2, PAD_W, cfg.padH, 6);
  ctx.fill();
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#fff';
  rrect(x - PAD_W/2 + 2.5, y - cfg.padH/2 + 2.5, PAD_W-5, cfg.padH-5, 4);
  ctx.fill();
  ctx.restore();
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function drawBall() {
  for (let i = 0; i < trail.length; i++) {
    const t = i / trail.length;
    const col = ball.vx > 0 ? COL_L : COL_R;
    ctx.save();
    ctx.globalAlpha = t * t * 0.48;
    ctx.beginPath();
    ctx.arc(trail[i].x, trail[i].y, BALL_R*(0.28+t*0.72), 0, Math.PI*2);
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 9;
    ctx.fill();
    ctx.restore();
  }
  const col = ball.vx > 0 ? COL_R : COL_L;
  ctx.save();
  ctx.shadowColor = col;
  ctx.shadowBlur = 44;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R*1.95, 0, Math.PI*2);
  ctx.fillStyle = col + '30';
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.shadowColor = col;
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.restore();
}

function flashScore(side) {
  const el = document.getElementById('score-' + side);
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 160);
}

// ── Main loop ──
let lastTs = null;
function tick(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;

  const lx = PAD_MARGIN + PAD_W/2;
  const rx = W - PAD_MARGIN - PAD_W/2;

  if (running) {
    // Paddle movement
    if (humanMode) {
      moveHuman(padL, dt);
    } else {
      if (ball.vx < 0) moveAI(padL, ball.y, offsetL, dt);
      else padL.y += (H/2 - padL.y) * 0.025;
    }

    if (ball.vx > 0) moveAI(padR, ball.y, offsetR, dt);
    else padR.y += (H/2 - padR.y) * 0.025;

    padL.y = Math.max(cfg.padH/2, Math.min(H - cfg.padH/2, padL.y));
    padR.y = Math.max(cfg.padH/2, Math.min(H - cfg.padH/2, padR.y));

    if (!scoring) {
      trail.push({ x: ball.x, y: ball.y });
      if (trail.length > TRAIL_LEN) trail.shift();

      ball.x += ball.vx * dt * 60;
      ball.y += ball.vy * dt * 60;

      // Walls
      if (ball.y - BALL_R < 0) {
        ball.y = BALL_R;
        ball.vy = Math.abs(ball.vy);
        spawnParticles(ball.x, 0, '#ffffff50');
      }
      if (ball.y + BALL_R > H) {
        ball.y = H - BALL_R;
        ball.vy = -Math.abs(ball.vy);
        spawnParticles(ball.x, H, '#ffffff50');
      }

      // Left paddle
      if (ball.vx < 0 &&
          ball.x - BALL_R <= lx + PAD_W/2 &&
          ball.x + BALL_R >= lx - PAD_W/2 &&
          ball.y >= padL.y - cfg.padH/2 - BALL_R &&
          ball.y <= padL.y + cfg.padH/2 + BALL_R) {

        ball.x = lx + PAD_W/2 + BALL_R + 1;
        const hitPos = Math.max(-1, Math.min(1, (ball.y - padL.y) / (cfg.padH/2)));
        const angle = hitPos * cfg.maxAngle;
        rally++;
        const spd = Math.min(cfg.baseSpeed + rally * 0.30, cfg.maxSpeed);
        ball.vx = Math.abs(spd * Math.cos(angle));
        ball.vy = spd * Math.sin(angle);
        spawnParticles(ball.x, ball.y, COL_L);
        offsetR = (Math.random() - 0.5) * cfg.padH * cfg.offsetRange;
        document.getElementById('speed-num').textContent = rally;
      }

      // Right paddle
      if (ball.vx > 0 &&
          ball.x + BALL_R >= rx - PAD_W/2 &&
          ball.x - BALL_R <= rx + PAD_W/2 &&
          ball.y >= padR.y - cfg.padH/2 - BALL_R &&
          ball.y <= padR.y + cfg.padH/2 + BALL_R) {

        ball.x = rx - PAD_W/2 - BALL_R - 1;
        const hitPos = Math.max(-1, Math.min(1, (ball.y - padR.y) / (cfg.padH/2)));
        const angle = hitPos * cfg.maxAngle;
        rally++;
        const spd = Math.min(cfg.baseSpeed + rally * 0.30, cfg.maxSpeed);
        ball.vx = -Math.abs(spd * Math.cos(angle));
        ball.vy = spd * Math.sin(angle);
        spawnParticles(ball.x, ball.y, COL_R);
        offsetL = (Math.random() - 0.5) * cfg.padH * cfg.offsetRange;
        document.getElementById('speed-num').textContent = rally;
      }

      // Score
      if (ball.x < -BALL_R * 2) {
        scoring = true;
        scores.r++;
        document.getElementById('score-r').textContent = scores.r;
        flashScore('r');
        spawnParticles(0, ball.y, COL_R);
        showBubble('left', false);
        showBubble('right', true);
        setTimeout(() => resetBall(1), 1050);
      }
      if (ball.x > W + BALL_R * 2) {
        scoring = true;
        scores.l++;
        document.getElementById('score-l').textContent = scores.l;
        flashScore('l');
        spawnParticles(W, ball.y, COL_L);
        showBubble('right', false);
        showBubble('left', true);
        setTimeout(() => resetBall(-1), 1050);
      }
    }
  }

  updateParticles(dt);

  // Draw
  ctx.clearRect(0, 0, W, H);

  const vig = ctx.createRadialGradient(W/2, H/2, H*0.18, W/2, H/2, H*0.88);
  vig.addColorStop(0, 'rgba(5,5,8,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vig;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.setLineDash([9,16]);
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.restore();

  drawParticles();
  drawBall();
  drawPaddle(lx, padL.y, COL_L);
  drawPaddle(rx, padR.y, COL_R);

  // Pause overlay
  if (!running) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = "28px 'Bebas Neue', sans-serif";
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.textAlign = 'center';
    ctx.fillText(scores.l === 0 && scores.r === 0 ? 'DRÜCKE START' : 'PAUSE', W/2, H/2 - 8);
    ctx.font = "12px 'DM Mono', monospace";
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillText('Leertaste oder Button', W/2, H/2 + 22);
  }

  requestAnimationFrame(tick);
}

// Init
resetBall(Math.random() > 0.5 ? 1 : -1);
requestAnimationFrame(tick);
</script>
</body>
</html>
